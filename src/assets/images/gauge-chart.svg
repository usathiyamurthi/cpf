<svg width="221" height="154" viewBox="0 0 221 154" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Outer arc background -->
<path d="M 20 110 A 90 90 0 0 1 201 110" stroke="#E0E0E0" stroke-width="12" fill="none" stroke-linecap="round"/>

<!-- Inner arc background -->
<path d="M 25 105 A 80 80 0 0 1 196 105" stroke="#F5F5F5" stroke-width="10" fill="none" stroke-linecap="round"/>

<!-- Progress arc (adjust angle for different values) -->
<path d="M 25 105 A 80 80 0 0 1 110.5 25" stroke="#0071BC" stroke-width="10" fill="none" stroke-linecap="round"/>

<!-- Needle/Pointer -->
<g transform="translate(110.5, 110)">
  <line x1="0" y1="0" x2="0" y2="-75" stroke="#004370" stroke-width="3" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="6" fill="#004370"/>
  <circle cx="0" cy="0" r="3" fill="#0071BC"/>
</g>

<!-- Scale marks -->
<text x="30" y="120" font-family="Open Sans" font-size="9" fill="#1F1F20" text-anchor="middle">100</text>
<text x="195" y="120" font-family="Open Sans" font-size="9" fill="#1F1F20" text-anchor="middle">0</text>
<text x="50" y="60" font-family="Open Sans" font-size="9" fill="#1F1F20" text-anchor="middle">80</text>
<text x="90" y="30" font-family="Open Sans" font-size="9" fill="#1F1F20" text-anchor="middle">60</text>
<text x="135" y="30" font-family="Open Sans" font-size="9" fill="#1F1F20" text-anchor="middle">40</text>
<text x="175" y="60" font-family="Open Sans" font-size="9" fill="#1F1F20" text-anchor="middle">20</text>

<!-- Center value display -->
<rect x="85" y="125" width="52" height="25" rx="4" fill="white" stroke="#0071BC" stroke-width="1"/>
<text x="111" y="143" font-family="Open Sans" font-size="16" font-weight="700" fill="#004370" text-anchor="middle">65</text>
</svg>
