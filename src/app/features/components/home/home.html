<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPF Country Dashboard | Real Outcomes</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <!-- <link rel="stylesheet" href="assets/styles/home.scss"> -->
</head>
<body>
    
    <!-- Header -->
    <app-header></app-header>

    <!-- Hero Banner -->
    <section class="hero-banner">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-auto text-center">
                    <h2 class="hero-title-white mb-0">Five CPF Lenses</h2>
                    <h2 class="hero-title-blue mb-3">One Real Direction</h2>
                    <button class="btn btn-secondary-brand">SELECT COUNTRY</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Instruction Text -->
            <div class="row mb-4">
                <div class="col-12">
                    <p class="instruction-text">Select from 140+ countries and click one of the dimensions.</p>
                </div>
            </div>

            <!-- Five Lenses Cards -->
            <div class="row g-4 justify-content-center">
                
                <!-- Relevance Card -->
                <div class="col-12 col-md-6 col-lg-4 col-xl">
                    <div class="lens-card">
                        <div class="lens-card-header">
                            <img src="assets/icons/icon-relevance.svg" alt="Relevance Icon" class="lens-icon">
                            <h3 class="lens-title">Relevance</h3>
                        </div>
                        <p class="lens-question">Is our focus correct?</p>
                        <div class="lens-gauge">
                            <app-speedometer [value]="72"></app-speedometer>
                        </div>
                    </div>
                </div>

                <!-- Effectiveness Card -->
                <div class="col-12 col-md-6 col-lg-4 col-xl">
                    <div class="lens-card">
                        <div class="lens-card-header">
                            <img src="assets/icons/icon-effectiveness.svg" alt="Effectiveness Icon" class="lens-icon">
                            <h3 class="lens-title">Effectiveness</h3>
                        </div>
                        <p class="lens-question">How effective are we?</p>
                        <div class="lens-gauge">
                            <app-speedometer [value]="3.0" [maxValue]="5"></app-speedometer>
                        </div>
                    </div>
                </div>

                <!-- Sustainability Card -->
                <div class="col-12 col-md-6 col-lg-4 col-xl">
                    <div class="lens-card">
                        <div class="lens-card-header">
                            <img src="assets/icons/icon-sustainability.svg" alt="Sustainability Icon" class="lens-icon">
                            <h3 class="lens-title">Sustainability</h3>
                        </div>
                        <p class="lens-question">Do our solutions last?</p>
                        <div class="lens-gauge">
                            <img src="assets/images/gauge-chart.svg" alt="Sustainability Gauge" class="gauge-image">
                        </div>
                    </div>
                </div>

                <!-- Efficiency Card -->
                <div class="col-12 col-md-6 col-lg-4 col-xl">
                    <div class="lens-card">
                        <div class="lens-card-header">
                            <img src="assets/icons/icon-efficiency.svg" alt="Efficiency Icon" class="lens-icon">
                            <h3 class="lens-title">Efficiency</h3>
                        </div>
                        <p class="lens-question">Is delivery efficient?</p>
                        <div class="lens-gauge">
                            <img src="assets/images/gauge-chart.svg" alt="Efficiency Gauge" class="gauge-image">
                        </div>
                    </div>
                </div>

                <!-- Impact Card -->
                <div class="col-12 col-md-6 col-lg-4 col-xl">
                    <div class="lens-card">
                        <div class="lens-card-header">
                            <img src="assets/icons/icon-impact.svg" alt="Impact Icon" class="lens-icon">
                            <h3 class="lens-title">Impact</h3>
                        </div>
                        <p class="lens-question">What's our impact?</p>
                        <div class="lens-gauge">
                            <img src="assets/images/gauge-chart.svg" alt="Impact Gauge" class="gauge-image">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
   

    <app-footer></app-footer> 

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
