<div class="d-flex px-4 pt-3 pb-4 new-modal">
    <button type="button" class="close order-3 m-0 d-flex ml-auto" aria-label="Close"
        (click)="bsModalRef.hide();cancelClick()">
        <span aria-hidden="true">&times;</span>
    </button>
    <span> <i class="far" [ngClass]="iconClass"></i></span>
    <div [ngClass]="iconClass != '' ? 'pl-3' : ''">
        @if (title != '') {
            <div class="pb-2">
                <h3 class="modal-head m-0">
                    {{ title }}
                </h3>
            </div>
        }
        <div class="modal-body-content">
            <div class="multi_lines_text" [innerHTML]="msg"></div>
        </div>
    </div>
</div>
<div class="modal-footer pb-3" [ngClass]="{ 'justify-content-center': !cancelLabel }">
    @if (cancelLabel) {
        <button type="button" class="cpf-btn btn btn-outline-primary btn-sm" (click)="cancelClick()">
            {{ cancelLabel }}
        </button>
    }
    <button type="button" class="cpf-btn btn btn-primary btn-sm" (click)="confirmClick()">{{ confirmLabel }}</button>
</div>
