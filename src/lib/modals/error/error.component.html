<div class="d-flex px-4 pt-3 pb-4 new-modal">
    <button type="button" class="close order-3 m-0 d-flex ml-auto" aria-label="Close" (click)="bsModalRef.hide()">
        <span aria-hidden="true">&times;</span>
    </button>
    <span> <i class="far alert-icon"></i></span>
    <div class="pl-3">
        @if (title != '') {
            <div class="pb-2">
                <h3 class="modal-head m-0">
                    {{ title }}
                </h3>
            </div>
        }
        <div class="modal-body-content">
            @if (msg) {
                <p class="mb-0 multi_lines_text" [innerHTML]="msg"></p>
            }
            @if (showDetails) {
                <div class="mt-3 detail-box">
                    <label>Details:</label>
                    <p>{{ details }}</p>
                </div>
            }
        </div>
    </div>
</div>
<div class="modal-footer pb-3" [ngClass]="details?'justify-content-between':'justify-content-center'">
    @if (details) {
        <button type="button" class="btn btn-primary btn-sm cpf-btn"
            (click)="showDetails = !showDetails">Details</button>
    }
    <button type="button" class="btn btn-primary btn-sm cpf-btn" (click)="okCallback()">{{okLabel}}</button>
</div>
